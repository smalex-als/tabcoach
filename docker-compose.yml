services:
  tabcoach:
    build: .
    ports:
      - "3847:3847"
    environment:
      HOST: 0.0.0.0
      PORT: 3847
      TAB_SWITCH_LOG_PATH: /data/tab-switch-log.jsonl
      TAB_EVENT_LOG_PATH: /data/tabcoach-events.jsonl
      DESKTOP_APP_LAUNCH_PROXY_URL: http://host.docker.internal:3848/api/desktop-apps/launch
    volumes:
      - ./data:/data
    restart: unless-stopped
