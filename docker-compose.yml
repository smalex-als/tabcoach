services:
  tabcoach:
    build: .
    ports:
      - "3847:3847"
    environment:
      HOST: 0.0.0.0
      PORT: 3847
      TAB_SWITCH_LOG_PATH: /data/tab-switch-log.jsonl
      TAB_EVENT_LOG_PATH: /data/tabcoach-events.jsonl
      DESKTOP_APPS_JSON: '[{"id":"iterm","label":"iTerm","macAppName":"iTerm"},{"id":"intellij-idea","label":"IntelliJ IDEA","macAppName":"IntelliJ IDEA"},{"id":"obsidian","label":"Obsidian","macAppName":"Obsidian"},{"id":"webstorm","label":"WebStorm","macAppName":"WebStorm"}]'
    volumes:
      - ./data:/data
    restart: unless-stopped
